# Local dev infra. MySQL (university-mandated engine); the `web` + `seed`
# services land here in P3 (see .claude/PLAN.md §G).
#
#   docker compose up -d db     # start MySQL
#   cd web && npm run db:deploy # apply migrations
#   cd web && npm run seed      # load data (~60s, hits the Uniandes API)

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_USER: pensum
      MYSQL_PASSWORD: pensum
      MYSQL_DATABASE: pensum
      MYSQL_ROOT_PASSWORD: pensum
    ports:
      - "3306:3306"
    volumes:
      - pensum-mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u pensum -ppensum"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pensum-mysqldata:
